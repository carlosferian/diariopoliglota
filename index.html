    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

<!-- ── store.js ── datas, persistência e streak ──────────────────────── -->
<script>
(function () {
  const LANGS = ['EN', 'IT', 'DE', 'JP'];
  const META_KEY = 'diary_meta_v1';
  const DAY = 86400000;

  const pad2 = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const fromIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

  // --- MÓDULO INDEXEDDB ---
  const DB_NAME = 'diario_poliglota_db';
  const STORE_NAME = 'strokes';

  function getDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      request.onsuccess = (e) => resolve(e.target.result);
      request.onerror = (e) => reject(e.target.error);
    });
  }

  function dbGet(key) {
    return getDB().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    });
  }

  function dbSet(key, val) {
    return getDB().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(val, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    });
  }

  function dbDel(key) {
    return getDB().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    });
  }

  function dbGetAll() {
    return getDB().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const keysReq = store.getAllKeys();
        const valsReq = store.getAll();
        keysReq.onsuccess = () => {
          valsReq.onsuccess = () => {
            const result = {};
            const keys = keysReq.result;
            const vals = valsReq.result;
            for (let i = 0; i < keys.length; i++) {
              result[keys[i]] = vals[i];
            }
            resolve(result);
          };
        };
        keysReq.onerror = () => reject(keysReq.error);
        valsReq.onerror = () => reject(valsReq.error);
      });
    });
  }

  // --- LÓGICA DE NEGÓCIO ---
  const inkKey = (isoStr, lang) => `diary_ink_${isoStr}_${lang}`;

  function loadInk(isoStr, lang) {
    return dbGet(inkKey(isoStr, lang)).then((val) => val || []);
  }

  async function saveInk(isoStr, lang, strokes) {
    const key = inkKey(isoStr, lang);
    try {
      if (!strokes || !strokes.length) {
        await dbDel(key);
        const m = getMeta();
        if (m.days[isoStr] && Array.isArray(m.days[isoStr])) {
          m.days[isoStr] = m.days[isoStr].filter((l) => l !== lang);
          if (m.days[isoStr].length === 0) {
            delete m.days[isoStr];
          }
          setMeta(m);
        }
      } else {
        await dbSet(key, strokes);
        const m = getMeta();
        if (!m.days[isoStr] || m.days[isoStr] === true) {
          m.days[isoStr] = [];
        }
        if (Array.isArray(m.days[isoStr]) && !m.days[isoStr].includes(lang)) {
          m.days[isoStr].push(lang);
          setMeta(m);
        }
      }
      return true;
    } catch (e) {
      console.error('saveInk error:', e);
      return false;
    }
  }

  async function saveInkRaw(key, strokes) {
    if (!strokes || !strokes.length) {
      await dbDel(key);
    } else {
      await dbSet(key, strokes);
    }
  }

  function getMeta() {
    let m;
    try { m = JSON.parse(localStorage.getItem(META_KEY) || 'null'); } catch (e) { m = null; }
    if (!m) { m = { start: iso(today()), days: {} }; localStorage.setItem(META_KEY, JSON.stringify(m)); }
    if (!m.days) m.days = {};
    return m;
  }
  function setMeta(m) { localStorage.setItem(META_KEY, JSON.stringify(m)); }

  function dayHasInk(m, isoStr) {
    const val = m.days[isoStr];
    return !!(val && Array.isArray(val) && val.length > 0);
  }

  function dayHasAllLangs(m, isoStr) {
    const val = m.days[isoStr];
    return !!(val && Array.isArray(val) && LANGS.every((l) => val.includes(l)));
  }

  function currentStreak(m) {
    const t = today();
    let anchor = m.days[iso(t)] ? t : (m.days[iso(addDays(t, -1))] ? addDays(t, -1) : null);
    if (!anchor) return 0;
    let n = 0, cur = anchor;
    while (m.days[iso(cur)]) { n++; cur = addDays(cur, -1); }
    return n;
  }
  function bestStreak(m) {
    const keys = Object.keys(m.days).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      const d = fromIso(k);
      if (prev && (d - prev) === DAY) run++; else run = 1;
      best = Math.max(best, run); prev = d;
    }
    return best;
  }
  function totalDays(m) { return Object.keys(m.days).length; }

  function stats(m) {
    const keys = Object.keys(m.days);
    let allLangs = false, maxWeek = 0;
    for (const k of keys) {
      if (!allLangs && dayHasAllLangs(m, k)) allLangs = true;
      maxWeek = Math.max(maxWeek, weekFlatForDate(m, fromIso(k)) + 1);
    }
    return { total: keys.length, best: bestStreak(m), current: currentStreak(m), allLangs, maxWeek };
  }

  function weekFlatForDate(m, date) {
    const diff = Math.floor((today0(date) - fromIso(m.start)) / DAY);
    return Math.max(0, Math.min(47, Math.floor(diff / 7)));
  }
  function dayNumber(m, date) {
    return Math.floor((today0(date) - fromIso(m.start)) / DAY) + 1;
  }
  function today0(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

  // --- MIGRAÇÃO DE DADOS ---
  async function migrateLegacyData() {
    const keysToMigrate = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('diary_ink_')) {
        keysToMigrate.push(key);
      }
    }
    if (keysToMigrate.length === 0) {
      const m = getMeta();
      let updated = false;
      for (const isoStr of Object.keys(m.days)) {
        if (m.days[isoStr] === true) {
          m.days[isoStr] = ['EN'];
          updated = true;
        }
      }
      if (updated) setMeta(m);
      return;
    }

    const m = getMeta();
    let updated = false;

    for (const key of keysToMigrate) {
      const val = localStorage.getItem(key);
      if (val && val !== '[]') {
        try {
          const strokes = JSON.parse(val);
          await dbSet(key, strokes);
          
          const parts = key.split('_');
          if (parts.length >= 4) {
            const isoStr = parts[2];
            const lang = parts[3];
            if (!m.days[isoStr] || m.days[isoStr] === true) {
              m.days[isoStr] = [];
            }
            if (Array.isArray(m.days[isoStr]) && !m.days[isoStr].includes(lang)) {
              m.days[isoStr].push(lang);
              updated = true;
            }
          }
        } catch (e) {
          console.error('Erro de migração na chave:', key, e);
        }
      }
      localStorage.removeItem(key);
    }

    for (const isoStr of Object.keys(m.days)) {
      if (m.days[isoStr] === true) {
        m.days[isoStr] = ['EN'];
        updated = true;
      }
    }

    if (updated || keysToMigrate.length > 0) {
      setMeta(m);
    }
  }

  async function clearAll() {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  window.DiaryStore = {
    LANGS, iso, fromIso, today, addDays, today0,
    loadInk, saveInk, saveInkRaw, dbGetAll, migrateLegacyData, clearAll,
    getMeta, setMeta,
    currentStreak, bestStreak, totalDays, weekFlatForDate, dayNumber,
    dayHasAllLangs, stats,
  };
})();
</script>

<!-- ── ink.js ── caneta vetorial com pressão ─────────────────────────── -->
<script>
(function () {
  const WIDTHS = { fina: 0.012, grossa: 0.026 };

  class InkPad {
    constructor(canvas, opts = {}) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.onChange = opts.onChange || (() => {});
      this.onActive = opts.onActive || (() => {});
      this.penOnlyGetter = opts.penOnly || (() => false);
      this.strokes = [];
      this.cur = null;
      this.tool = { mode: 'pen', color: '#1b2030', width: 'grossa' };
      this.cssW = 1; this.cssH = 1;
      this._raf = null;
      this._resize();
      this._bind();
      this._ro = new ResizeObserver(() => this._resize());
      this._ro.observe(canvas);
    }

    setTool(t) { this.tool = Object.assign({}, this.tool, t); }
    isEmpty() { return this.strokes.length === 0; }
    getStrokes() { return this.strokes; }

    load(strokes) {
      this.strokes = Array.isArray(strokes) ? strokes : [];
      this.cur = null;
      this.redraw();
    }
    clear() {
      this.strokes = []; this.cur = null;
      this.redraw(); this.onChange(this.strokes);
    }
    undo() {
      if (this.cur) this.cur = null;
      else this.strokes.pop();
      this.redraw(); this.onChange(this.strokes);
    }

    _resize() {
      const r = this.canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      this.cssW = Math.max(1, r.width); this.cssH = Math.max(1, r.height);
      this.canvas.width = Math.round(this.cssW * dpr);
      this.canvas.height = Math.round(this.cssH * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.redraw();
    }

    _bind() {
      const c = this.canvas;
      c.style.touchAction = this.penOnlyGetter() ? 'pan-y' : 'none';
      const norm = (e) => {
        const r = c.getBoundingClientRect();
        return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height,
                 p: e.pressure && e.pressure > 0 ? e.pressure : 0.5 };
      };
      // FIX: removido window.__penSeen que bloqueava toque permanentemente após uso de caneta
      c.addEventListener('pointerdown', (e) => {
        if (this.penOnlyGetter() && e.pointerType === 'touch') return;
        e.preventDefault();
        c.setPointerCapture(e.pointerId);
        this.cur = { color: this.tool.color, wFrac: WIDTHS[this.tool.width],
                     erase: this.tool.mode === 'eraser', pts: [norm(e)] };
        this.onActive(true);
        this._drawDab(this.cur, 0);
      });
      c.addEventListener('pointermove', (e) => {
        if (!this.cur) return;
        if (this.penOnlyGetter() && e.pointerType === 'touch') return;
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of evs) {
          this.cur.pts.push(norm(ev));
          this._drawSeg(this.cur, this.cur.pts.length - 1);
        }
      });
      const end = (e) => {
        if (!this.cur) return;
        if (this.cur.pts.length === 1) this.cur.pts.push(Object.assign({}, this.cur.pts[0]));
        this.strokes.push(this.cur); this.cur = null;
        this.onActive(false);
        this.onChange(this.strokes);
      };
      c.addEventListener('pointerup', end);
      c.addEventListener('pointercancel', end);
      c.addEventListener('pointerleave', (e) => { if (this.cur && e.buttons === 0) end(e); });
    }

    _styleFor(s, ctx) {
      ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      ctx.strokeStyle = s.erase ? 'rgba(0,0,0,1)' : s.color;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    }
    _w(s, p) { return s.wFrac * this.cssH * (s.erase ? 2.4 : (0.45 + 1.0 * p)); }

    _drawDab(s, i) {
      const ctx = this.ctx, pt = s.pts[i];
      this._styleFor(s, ctx);
      ctx.beginPath();
      ctx.arc(pt.x * this.cssW, pt.y * this.cssH, this._w(s, pt.p) / 2, 0, Math.PI * 2);
      ctx.fillStyle = s.erase ? 'rgba(0,0,0,1)' : s.color;
      ctx.fill();
    }
    _drawSeg(s, i) {
      if (i < 1) return;
      const ctx = this.ctx, a = s.pts[i - 1], b = s.pts[i];
      this._styleFor(s, ctx);
      ctx.lineWidth = this._w(s, (a.p + b.p) / 2);
      ctx.beginPath();
      ctx.moveTo(a.x * this.cssW, a.y * this.cssH);
      ctx.lineTo(b.x * this.cssW, b.y * this.cssH);
      ctx.stroke();
    }

    redraw() {
      const ctx = this.ctx;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.restore();
      const all = this.cur ? this.strokes.concat([this.cur]) : this.strokes;
      for (const s of all) {
        if (s.pts.length === 1) { this._drawDab(s, 0); continue; }
        for (let i = 1; i < s.pts.length; i++) this._drawSeg(s, i);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    destroy() { this._ro.disconnect(); }
  }

  window.InkPad = InkPad;
})();
</script>

  { id: 'b1',    icon: '🎓', name: 'Rumo ao B1',      desc: 'Chegue ao Módulo 5',      test: (s) => s.maxWeek >= 17 },
  { id: 's100',  icon: '👑', name: 'Centurião',       desc: '100 dias seguidos',       test: (s) => s.best >= 100 },
];

function makeTheme(mode) {
  if (mode === 'light') return {
    mode, appBg: '#E9EEF7', grid: 'rgba(30,42,80,0.05)',
    card: '#FFFFFF', panel: '#FFFFFF', band: 'linear-gradient(90deg,#FFFFFF,#F2F6FC)',
    border: '#dce3f0', borderStrong: '#c6d0e4',
    text: '#1b2440', text2: '#46506b', dim: '#6b7690', faint: '#9aa3bb',
    ctrlBg: '#eef1f9', ctrlHover: '#e1e7f4',
    cream: '#FCFBF6', modalOverlay: 'rgba(20,28,50,0.38)', modalBg: '#FFFFFF', cellBg: '#F1F4FA',
    accent: '#0E9F6E', flame: '#F97316', shadow: '0 2px 12px rgba(30,42,80,0.10)',
  };
  return {
    mode, appBg: '#0E1326', grid: 'rgba(255,255,255,0.03)',
    card: '#171E36', panel: '#141A30', band: 'linear-gradient(90deg,#1a2142,#171E36)',
    border: '#2a3358', borderStrong: '#38426e',
    text: '#ffffff', text2: '#cfd6ea', dim: '#8b93b0', faint: '#6b739a',
    ctrlBg: '#232c50', ctrlHover: '#2e3a66',
    cream: '#FBFAF5', modalOverlay: 'rgba(6,9,16,0.72)', modalBg: '#141A30', cellBg: '#1b2240',
    accent: '#6EE7B7', flame: '#FBBF24', shadow: '0 0 20px rgba(0,0,0,0.25)',
  };
}

function guideStyle(code, t, paper) {
  if (paper === 'branco') return {};
  if (paper === 'quadriculado') {
    const cell = code === 'JP' ? 54 : 40;
    return {
      backgroundColor: t.primary + '0a',
      backgroundImage: `repeating-linear-gradient(to right, ${t.primary}33 0 1px, transparent 1px ${cell}px), repeating-linear-gradient(to bottom, ${t.primary}33 0 1px, transparent 1px ${cell}px)`,
    };
  }
  return { backgroundImage: `repeating-linear-gradient(to bottom, transparent 0, transparent 42px, ${t.primary}30 42px, ${t.primary}30 44px)`, backgroundPosition: '0 8px' };
}

// FIX: isActive prop adicionado para indicador visual de canvas ativo
function WritingBox({ code, data, T, paper, registerCanvas, onClearBox, isActive }) {

// FIX: adicionados props onDeleteDay, onExport, onImport; calendário mostra ✓ em vez de ✕;
// dias concluídos abrem confirmação de exclusão; botões de backup adicionados
function ProgressModal({ meta, viewDate, T, onPick, onClose, onDeleteDay, onExport, onImport, onClearHistory }) {
  const [m, setM] = useState(() => new Date(viewDate.getFullYear(), viewDate.getMonth(), 1));
  const [confirmDel, setConfirmDel] = useState(null);
  const t0 = DS.today();
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const offset = first.getDay();
  const ndays = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= ndays; d++) cells.push(d);
  const s = DS.stats(meta);

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: T.modalOverlay, zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(3px)', padding: 16 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: T.modalBg, border: `1px solid ${T.border}`, borderRadius: 20, padding: 22, width: 720, maxWidth: '100%', maxHeight: '92vh', overflow: 'auto', fontFamily: "'Nunito', sans-serif", boxShadow: '0 24px 70px rgba(0,0,0,0.45)', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 22 }}>
        {/* coluna calendário */}
        <div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
            {[['🔥 sequência', s.current], ['🏆 recorde', s.best], ['✍️ dias', s.total]].map(([lab, val], i) => (
              <div key={i} style={{ flex: 1, background: T.cellBg, borderRadius: 12, padding: '9px 6px', textAlign: 'center', border: `1px solid ${T.border}` }}>
                <div style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 24, color: T.flame, lineHeight: 1 }}>{val}</div>
                <div style={{ fontSize: 9.5, color: T.dim, marginTop: 3, fontWeight: 700 }}>{lab}</div>
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
            <button onClick={() => setM(new Date(m.getFullYear(), m.getMonth() - 1, 1))} style={navBtnS(T)}>‹</button>
            <div style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 17, color: T.text, textTransform: 'capitalize' }}>{MES_PT[m.getMonth()]} {m.getFullYear()}</div>
            <button onClick={() => setM(new Date(m.getFullYear(), m.getMonth() + 1, 1))} style={navBtnS(T)}>›</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 5, marginBottom: 5 }}>
            {WD_PT.map((d, i) => <div key={i} style={{ textAlign: 'center', fontSize: 11, fontWeight: 800, color: T.faint }}>{d}</div>)}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 5 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const date = new Date(m.getFullYear(), m.getMonth(), d);
              const done = !!meta.days[DS.iso(date)];
              const isToday = DS.iso(date) === DS.iso(t0);
              const isView = DS.iso(date) === DS.iso(viewDate);
              const future = DS.today0(date) > t0;
              const isConfirming = confirmDel === DS.iso(date);
              return (
                <button key={i} onClick={() => {
                  if (future) return;
                  if (done) setConfirmDel(isConfirming ? null : DS.iso(date));
                  else onPick(date);
                }} style={{
                  aspectRatio: '1', borderRadius: 9, cursor: future ? 'default' : 'pointer', fontSize: 12, fontWeight: 800,
                  border: isConfirming ? `2px solid #dc2626` : (isView ? `2px solid ${T.accent}` : (isToday ? `2px solid ${T.flame}` : `1px solid ${T.border}`)),
                  background: done ? 'linear-gradient(135deg,#FBBF24,#F97316)' : T.cellBg,
                  color: done ? '#0E1326' : (future ? T.faint : T.dim),
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>{done ? '✓' : d}</button>
              );
            })}
          </div>
          {/* confirmação de exclusão de dia */}
          {confirmDel && (
            <div style={{ marginTop: 10, padding: '10px 12px', background: T.cellBg, border: `1px solid #dc2626`, borderRadius: 10, display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
              <span style={{ flex: 1, fontSize: 12, color: T.text2, minWidth: 80 }}>Apagar escrita de <strong>{confirmDel}</strong>?</span>
              <button onClick={() => { onPick(DS.fromIso(confirmDel)); setConfirmDel(null); }}
                style={{ background: T.ctrlBg, border: `1px solid ${T.border}`, color: T.text, borderRadius: 7, padding: '4px 12px', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>Ir ao dia</button>
              <button onClick={() => { onDeleteDay(DS.fromIso(confirmDel)); setConfirmDel(null); }}
                style={{ background: '#dc2626', border: 'none', color: '#fff', borderRadius: 7, padding: '4px 12px', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>Apagar ✗</button>
              <button onClick={() => setConfirmDel(null)}
                style={{ background: 'none', border: 'none', color: T.dim, cursor: 'pointer', fontSize: 16, padding: '2px 4px', lineHeight: 1 }}>×</button>
            </div>
          )}
          {!confirmDel && (
            <p style={{ fontSize: 11, color: T.faint, marginTop: 8, marginBottom: 0 }}>Clique em um dia concluído (✓) para apagar.</p>
          )}
        </div>
        {/* coluna medalhas */}
        <div style={{ display: 'flex', flexDirection: 'column' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 12 }}>
            <span style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 18, color: T.text }}>Medalhas</span>
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: T.accent }}>{MEDALS.filter((md) => md.test(s)).length}/{MEDALS.length}</span>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 9, flex: 1 }}>
            {MEDALS.map((md) => {
              const got = md.test(s);
              return (
                <div key={md.id} style={{ background: got ? 'linear-gradient(135deg,#FBBF2422,#F9731611)' : T.cellBg, border: got ? `1px solid ${T.flame}` : `1px dashed ${T.border}`, borderRadius: 12, padding: '10px 11px', display: 'flex', alignItems: 'center', gap: 10, opacity: got ? 1 : 0.55 }}>
                  <span style={{ fontSize: 26, filter: got ? 'none' : 'grayscale(1)' }}>{md.icon}</span>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 800, fontSize: 13.5, color: T.text, lineHeight: 1.1 }}>{md.name}</div>
                    <div style={{ fontSize: 11, color: T.dim, marginTop: 1 }}>{md.desc}</div>
                  </div>
                </div>
              );
            })}
          </div>
          {/* botões de backup */}
          <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
            <button onClick={onExport}
              style={{ flex: 1, background: T.ctrlBg, border: `1px solid ${T.borderStrong}`, color: T.text, borderRadius: 10, padding: '9px 6px', fontWeight: 800, cursor: 'pointer', fontFamily: "'Nunito', sans-serif", fontSize: 13 }}>💾 Backup</button>
            <label style={{ flex: 1, background: T.ctrlBg, border: `1px solid ${T.borderStrong}`, color: T.text, borderRadius: 10, padding: '9px 6px', fontWeight: 800, cursor: 'pointer', fontFamily: "'Nunito', sans-serif", fontSize: 13, textAlign: 'center', display: 'block' }}>
              📥 Restaurar
              <input type="file" accept=".json" style={{ display: 'none' }} onChange={(e) => { if (e.target.files[0]) { onImport(e.target.files[0]); onClose(); } }} />
            </label>
          </div>
          <button onClick={onClearHistory}
            style={{ marginTop: 12, width: '100%', background: '#dc2626', border: 'none', color: '#fff', borderRadius: 10, padding: '9px 6px', fontWeight: 800, cursor: 'pointer', fontFamily: "'Nunito', sans-serif", fontSize: 13 }}>⚠️ Limpar Histórico</button>
          <button onClick={onClose} style={{ marginTop: 8, width: '100%', background: T.ctrlBg, border: `1px solid ${T.borderStrong}`, color: T.text, borderRadius: 10, padding: '11px', fontWeight: 800, cursor: 'pointer', fontFamily: "'Nunito', sans-serif" }}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

function MedalToast({ medal, T }) {
  if (!medal) return null;
  return (
    <div style={{ position: 'fixed', top: 18, left: '50%', transform: 'translateX(-50%)', zIndex: 300, background: 'linear-gradient(135deg,#FBBF24,#F97316)', color: '#0E1326', padding: '12px 22px', borderRadius: 14, display: 'flex', alignItems: 'center', gap: 12, boxShadow: '0 12px 40px rgba(249,115,22,0.45)', fontFamily: "'Nunito', sans-serif", animation: 'toastIn .35s ease' }}>
      <span style={{ fontSize: 30 }}>{medal.icon}</span>
      <div>
        <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, letterSpacing: 1 }}>MEDALHA DESBLOQUEADA!</div>
        <div style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 19, lineHeight: 1.05 }}>{medal.name}</div>
      </div>
    </div>
  );
}

const navBtnS = (T) => ({ background: T.ctrlBg, border: `1px solid ${T.borderStrong}`, color: T.text, borderRadius: 9, width: 36, height: 32, cursor: 'pointer', fontSize: 16, fontWeight: 700 });

Object.assign(window, { WritingBox, ProgressModal, MedalToast, INK_COLORS, MES_PT, DIA_PT, MEDALS, makeTheme, navBtnS });
</script>

<!-- ── diary-app.jsx ── app principal ────────────────────────────────── -->
<script type="text/babel">
const { useState: useStateApp, useEffect, useRef, useCallback } = React;

function DiaryApp() {
  const [meta, setMeta] = useStateApp(() => DS.getMeta());
  const [viewDate, setViewDate] = useStateApp(() => DS.today());
  const [tool, setTool] = useStateApp({ mode: 'pen', color: INK_COLORS[0].v, width: 'grossa' });
  // FIX: penOnly agora persiste entre sessões
  const [penOnly, setPenOnly] = useStateApp(() => localStorage.getItem('diary_penOnly') === 'true');
  const [paper, setPaper] = useStateApp(() => localStorage.getItem('diary_paper') || 'pautado');
  const [showCal, setShowCal] = useStateApp(false);
  const [quota, setQuota] = useStateApp(false);
  const [mode, setMode] = useStateApp(() => localStorage.getItem('diary_mode') || 'auto');
  const [toast, setToast] = useStateApp(null);
  const [activeCanvas, setActiveCanvas] = useStateApp(null);
  const [, setTick] = useStateApp(0);

  const dayNight = () => { const h = new Date().getHours(); return (h >= 7 && h < 19) ? 'light' : 'dark'; };
  const effMode = mode === 'auto' ? dayNight() : mode;
  const T = makeTheme(effMode);

  const canvasEls = useRef({});
  const pads = useRef({});
  const viewRef = useRef(viewDate);
  const penOnlyRef = useRef(penOnly);
  const lastLang = useRef('EN');
  const swipeStart = useRef(null);

  useEffect(() => { viewRef.current = viewDate; }, [viewDate]);
  useEffect(() => { penOnlyRef.current = penOnly; }, [penOnly]);
  useEffect(() => { localStorage.setItem('diary_mode', mode); }, [mode]);
  useEffect(() => { localStorage.setItem('diary_paper', paper); }, [paper]);
  useEffect(() => { localStorage.setItem('diary_penOnly', String(penOnly)); }, [penOnly]);
  useEffect(() => { const id = setInterval(() => setTick((n) => n + 1), 60000); return () => clearInterval(id); }, []);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 3400); return () => clearTimeout(id); }, [toast]);

  const registerCanvas = useCallback((code, el) => { if (el) canvasEls.current[code] = el; }, []);

  const handleInk = useCallback(async (code, strokes) => {
    lastLang.current = code;
    const isoStr = DS.iso(viewRef.current);
    const ok = await DS.saveInk(isoStr, code, strokes);
    if (!ok) {
      setQuota(true);
      return;
    }
    const m = DS.getMeta();
    const s = DS.stats(m);
    const earned = m.medals || [];
    const newly = MEDALS.filter((md) => md.test(s) && !earned.includes(md.id));
    if (newly.length) {
      m.medals = earned.concat(newly.map((md) => md.id));
      DS.setMeta(m);
      setToast(newly[0]);
    }
    setMeta({ ...m });
  }, []);

  // FIX: deleteDay — apaga escrita de um dia do calendário
  const deleteDay = useCallback(async (date) => {
    const isoStr = DS.iso(date);
    for (const lang of DS.LANGS) {
      await DS.saveInk(isoStr, lang, []);
    }
    const m = DS.getMeta();
    if (isoStr === DS.iso(viewRef.current)) {
      DS.LANGS.forEach((code) => { const p = pads.current[code]; if (p) p.load([]); });
    }
    setMeta({ ...m });
  }, []);

  // FIX: exportBackup — baixa todos os dados como JSON
  const exportBackup = useCallback(async () => {
    try {
      const meta = localStorage.getItem('diary_meta_v1');
      const metaObj = meta ? JSON.parse(meta) : null;
      const settings = {};
      ['diary_mode', 'diary_paper', 'diary_penOnly'].forEach((k) => {
        const v = localStorage.getItem(k);
        if (v !== null) settings[k] = v;
      });
      const strokes = await DS.dbGetAll();
      const backupData = {
        meta: metaObj,
        strokes: strokes,
        settings: settings
      };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `diario-poliglota-backup-${DS.iso(DS.today())}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (err) {
      console.error('Erro ao exportar backup:', err);
    }
  }, []);

  // FIX: handleImport — restaura dados de um arquivo JSON de backup
  const handleImport = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        let metaObj = null;
        let strokesMap = {};

        if (data.meta && data.strokes) {
          metaObj = data.meta;
          strokesMap = data.strokes;
          if (data.settings) {
            Object.entries(data.settings).forEach(([k, v]) => localStorage.setItem(k, v));
          }
        } else {
          // Formato legado (plano)
          Object.entries(data).forEach(([k, v]) => {
            if (k === 'diary_meta_v1') {
              try { metaObj = JSON.parse(v); } catch (err) {}
            } else if (k.startsWith('diary_ink_')) {
              try { strokesMap[k] = JSON.parse(v); } catch (err) {}
            } else if (k.startsWith('diary_')) {
              localStorage.setItem(k, v);
            }
          });
        }

        if (metaObj) {
          localStorage.setItem('diary_meta_v1', JSON.stringify(metaObj));
        }

        for (const [key, strokes] of Object.entries(strokesMap)) {
          await DS.saveInkRaw(key, strokes);
        }

        const m = DS.getMeta();
        setMeta({ ...m });
        const isoStr = DS.iso(viewRef.current);
        DS.LANGS.forEach(async (code) => {
          const strokes = await DS.loadInk(isoStr, code);
          const p = pads.current[code];
          if (p) p.load(strokes);
        });
      } catch (_) { /* arquivo inválido */ }
    };
    reader.readAsText(file);
  }, []);

  // FIX: exportPNG — exporta o dia atual como imagem (grade 2×2)
  const exportPNG = useCallback(() => {
    const firstEl = canvasEls.current['EN'];
    if (!firstEl) return;
    const cw = firstEl.width, ch = firstEl.height;
    const pad = 20;
    const off = document.createElement('canvas');
    off.width = cw * 2 + pad * 3;
    off.height = ch * 2 + pad * 3;
    const ctx = off.getContext('2d');
    ctx.fillStyle = T.mode === 'dark' ? '#0E1326' : '#E9EEF7';
    ctx.fillRect(0, 0, off.width, off.height);
    DS.LANGS.forEach((code, i) => {
      const el = canvasEls.current[code];
      if (!el) return;
      const col = i % 2, row = Math.floor(i / 2);
      const x = pad + col * (cw + pad);
      const y = pad + row * (ch + pad);
      ctx.fillStyle = T.cream;
      ctx.fillRect(x, y, el.width, el.height);
      ctx.drawImage(el, x, y);
    });
    const a = document.createElement('a');
    a.href = off.toDataURL('image/png');
    a.download = `diario-${DS.iso(viewRef.current)}.png`;
    a.click();
  }, [T]);

  const clearAllHistory = useCallback(async () => {
    if (!confirm("Tem certeza que deseja apagar TODO o seu histórico de escrita e estatísticas? Esta ação não pode ser desfeita!")) return;
    try {
      await DS.clearAll();
      localStorage.removeItem('diary_meta_v1');
      const m = DS.getMeta();
      setMeta({ ...m });
      DS.LANGS.forEach((code) => {
        const p = pads.current[code];
        if (p) p.clear();
      });
      setShowCal(false);
      alert("Histórico apagado com sucesso!");
    } catch (err) {
      console.error(err);
      alert("Erro ao apagar histórico.");
    }
  }, []);

  useEffect(() => {
    async function init() {
      await DS.migrateLegacyData();
      const m = DS.getMeta();
      setMeta({ ...m });
      const isoStr = DS.iso(viewRef.current);
      for (const code of LANGS) {
        const strokes = await DS.loadInk(isoStr, code);
        const p = pads.current[code];
        if (p) p.load(strokes);
      }
    }
    init();

    LANGS.forEach((code) => {
      const el = canvasEls.current[code];
      if (el && !pads.current[code]) {
        // FIX: onActive conecta ao indicador visual de canvas ativo
        pads.current[code] = new InkPad(el, {
          onChange: (s) => handleInk(code, s),
          penOnly: () => penOnlyRef.current,
          onActive: (active) => setActiveCanvas(active ? code : null),
        });
        pads.current[code].setTool(tool);
      }
    });
    return () => { Object.values(pads.current).forEach((p) => p.destroy && p.destroy()); pads.current = {}; };
  }, []);

  useEffect(() => {
    const isoStr = DS.iso(viewDate);
    LANGS.forEach(async (code) => {
      const strokes = await DS.loadInk(isoStr, code);
      const p = pads.current[code];
      if (p) p.load(strokes);
    });
  }, [viewDate]);

  useEffect(() => { Object.values(pads.current).forEach((p) => p.setTool(tool)); }, [tool]);

  useEffect(() => {
    Object.values(pads.current).forEach((p) => {
      if (p && p.canvas) {
        p.canvas.style.touchAction = penOnly ? 'pan-y' : 'none';
      }
    });
  }, [penOnly]);

  const flat = DS.weekFlatForDate(meta, viewDate);
  const M = window.YEAR[Math.floor(flat / 4)], W = M.w[flat % 4];
  const streak = DS.currentStreak(meta);
  const dayN = Math.max(1, DS.dayNumber(meta, viewDate));
  const isToday = DS.iso(viewDate) === DS.iso(DS.today());

  const goDay = (n) => setViewDate((d) => DS.addDays(d, n));
  const clearBox = (code) => { const p = pads.current[code]; if (p) p.clear(); };
  const undo = () => { const p = pads.current[lastLang.current]; if (p) p.undo(); };

  // FIX: atalhos de teclado expandidos — E (borracha), 1–4 (cores)
  useEffect(() => {
    const onKey = (e) => {
      if (showCal) return;
      if (e.key === 'ArrowRight') goDay(1);
      if (e.key === 'ArrowLeft') goDay(-1);
      if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
      if (!e.metaKey && !e.ctrlKey && !e.altKey) {
        if (e.key === 'e' || e.key === 'E') setTool((t) => ({ ...t, mode: t.mode === 'eraser' ? 'pen' : 'eraser' }));
        if (e.key === '1') setTool((t) => ({ ...t, mode: 'pen', color: INK_COLORS[0].v }));
        if (e.key === '2') setTool((t) => ({ ...t, mode: 'pen', color: INK_COLORS[1].v }));
        if (e.key === '3') setTool((t) => ({ ...t, mode: 'pen', color: INK_COLORS[2].v }));
        if (e.key === '4') setTool((t) => ({ ...t, mode: 'pen', color: INK_COLORS[3].v }));
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [showCal]);

  const ctrl = ctrlBtnS(T), dock = dockBtnS(T);
  const dateLabel = `${DIA_PT[viewDate.getDay()]}, ${viewDate.getDate()} de ${MES_PT[viewDate.getMonth()]}`;

  return (
    <div style={{ position: 'fixed', inset: 0, background: T.appBg, fontFamily: "'Nunito', sans-serif", display: 'flex', flexDirection: 'column', backgroundImage: `linear-gradient(${T.grid} 1px, transparent 1px), linear-gradient(90deg, ${T.grid} 1px, transparent 1px)`, backgroundSize: '40px 40px', overflow: 'hidden' }}>
      {/* TOP BAR */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '12px 20px 6px', flex: '0 0 auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: '0 0 auto' }}>
          <button onClick={() => goDay(-1)} style={ctrl} title="Dia anterior (←)">‹</button>
          <button onClick={() => goDay(1)} style={ctrl} title="Próximo dia (→)">›</button>
        </div>
        <div style={{ minWidth: 0, flex: '1 1 auto', marginLeft: 4 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 'clamp(18px, 3.5vw, 25px)', color: T.text, textTransform: 'capitalize', lineHeight: 1.1 }}>{dateLabel}</span>
            {!isToday && <button onClick={() => setViewDate(DS.today())} style={{ ...ctrl, width: 'auto', padding: '2px 10px', fontSize: 12, height: 24 }}>hoje</button>}
          </div>
          <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: T.dim, marginTop: 4 }}>DIA {dayN} · MÓDULO {M.n}/12 · LVL {M.lv}</div>
        </div>

        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
          {/* FIX: botão de exportar PNG do dia */}
          <button onClick={exportPNG} title="Exportar dia como PNG" style={{ ...ctrl, fontSize: 15 }}>📸</button>
          <button
            onClick={() => setMode(mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto'))}
            title={mode === 'auto' ? 'Tema: automático (claro 7h–19h, escuro à noite)' : (mode === 'light' ? 'Tema: claro' : 'Tema: escuro')}
            style={{ ...ctrl, fontSize: 17, position: 'relative' }}>
            {mode === 'auto' ? '🌗' : (mode === 'light' ? '☀️' : '🌙')}
            {mode === 'auto' && <span style={{ position: 'absolute', bottom: -3, right: -3, fontSize: 8, fontFamily: "'Space Mono', monospace", fontWeight: 700, color: T.accent, background: T.appBg, borderRadius: 4, padding: '0 2px', lineHeight: 1.3 }}>A</span>}
          </button>
          <button onClick={() => setShowCal(true)} title="Calendário, progresso e medalhas" style={{ display: 'flex', alignItems: 'center', gap: 10, background: T.panel, border: `1px solid ${T.border}`, borderRadius: 14, padding: '7px 16px', cursor: 'pointer' }}>
            <span style={{ fontSize: 22 }}>🔥</span>
            <div style={{ textAlign: 'left' }}>
              <div style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 22, color: T.flame, lineHeight: 0.95 }}>{streak}</div>
              <div style={{ fontSize: 10, color: T.dim, fontWeight: 700, letterSpacing: 0.5 }}>{streak === 1 ? 'DIA' : 'DIAS'} SEGUIDOS</div>
            </div>
            <span style={{ marginLeft: 6, fontFamily: "'Space Mono', monospace", fontSize: 11, color: T.accent }}>🏅 progresso ▾</span>
          </button>
        </div>
      </div>

      {/* THEME BAND */}
      <div style={{ margin: '4px 20px 10px', background: T.band, borderRadius: 13, border: `1px solid ${T.border}`, padding: '9px 18px', display: 'flex', alignItems: 'center', gap: 18, flex: '0 0 auto' }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', borderRight: `1px solid ${T.border}`, paddingRight: 16, flex: '0 0 auto' }}>
          <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: T.accent, letterSpacing: 1 }}>SEMANA</span>
          <span style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 28, color: T.text, lineHeight: 1 }}>{flat + 1}<span style={{ fontSize: 13, color: T.faint }}>/48</span></span>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: "'Fredoka', sans-serif", fontWeight: 600, fontSize: 23, color: T.text }}>"{W.t}"</span>
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: T.dim }}>{M.c}</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 9, marginTop: 1 }}>
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: T.accent, letterSpacing: 0.5, whiteSpace: 'nowrap' }}>NAS 4 ›</span>
            <span style={{ fontSize: 17, fontWeight: 700, color: T.text2 }}>{W.q}</span>
          </div>
        </div>
        <div style={{ flex: '0 0 auto', maxWidth: 260, fontSize: 12, color: T.dim, fontWeight: 600, lineHeight: 1.25, textAlign: 'right' }}>💡 {M.g}</div>
      </div>

      {/* GRADE 2×2 — FIX: swipe para navegar entre dias no mobile */}
      <div
        className="diary-grid"
        style={{ flex: 1, minHeight: 0, gap: 12, padding: '0 20px 88px' }}
        onTouchStart={(e) => { swipeStart.current = e.touches[0].clientX; }}
        onTouchEnd={(e) => {
          if (swipeStart.current === null) return;
          const dx = e.changedTouches[0].clientX - swipeStart.current;
          if (Math.abs(dx) > 60) { dx < 0 ? goDay(1) : goDay(-1); }
          swipeStart.current = null;
        }}
      >
        {LANGS.map((code) => (
          <WritingBox key={code} code={code} data={W.L[code]} T={T} paper={paper}
            registerCanvas={registerCanvas} onClearBox={clearBox}
            isActive={activeCanvas === code} />
        ))}
      </div>

      {/* BARRA DE FERRAMENTAS — FIX: scroll horizontal no mobile */}
      <div style={{ position: 'fixed', left: '50%', bottom: 16, transform: 'translateX(-50%)', zIndex: 100,
        display: 'flex', alignItems: 'center', gap: 8,
        background: T.mode === 'light' ? 'rgba(255,255,255,0.97)' : 'rgba(20,26,48,0.95)',
        border: `1px solid ${T.border}`, borderRadius: 16, padding: '6px 10px',
        boxShadow: '0 10px 36px rgba(0,0,0,0.4)', backdropFilter: 'blur(6px)',
        maxWidth: 'calc(100vw - 24px)', overflowX: 'auto' }}>
        {/* Grupo Cores */}
        <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
          {INK_COLORS.map((c) => (
            <button key={c.id} onClick={() => setTool((t) => ({ ...t, mode: 'pen', color: c.v }))} title={c.label}
              style={{ width: 28, height: 28, borderRadius: '50%', background: c.v, cursor: 'pointer', border: tool.mode === 'pen' && tool.color === c.v ? `3px solid ${T.accent}` : `2px solid ${T.borderStrong}`, flexShrink: 0 }} />
          ))}
        </div>
        <div style={{ width: 1, height: 20, background: T.border, flexShrink: 0 }} />
        {/* Grupo Caneta/Tamanho/Borracha/Desfazer */}
        <div style={{ display: 'flex', gap: 3, background: T.ctrlBg, borderRadius: 10, padding: 2, flexShrink: 0 }}>
          {[['fina', 'Fina', 3], ['grossa', 'Grossa', 6]].map(([w, lab, dot]) => (
            <button key={w} onClick={() => setTool((t) => ({ ...t, width: w, mode: 'pen' }))} title={lab}
              style={{ background: tool.width === w && tool.mode === 'pen' ? T.ctrlHover : 'transparent', border: 'none', color: T.text, borderRadius: 8, width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
              <span style={{ width: dot, height: dot, borderRadius: '50%', background: T.text }} />
            </button>
          ))}
          <button onClick={() => setTool((t) => ({ ...t, mode: t.mode === 'eraser' ? 'pen' : 'eraser' }))} title="Borracha (E)"
            style={{ background: tool.mode === 'eraser' ? T.accent : 'transparent', border: 'none', color: tool.mode === 'eraser' ? '#0E1326' : T.text, borderRadius: 8, width: 28, height: 28, fontSize: 13, cursor: 'pointer' }}>🧽</button>
          <button onClick={undo} title="Desfazer (⌘Z)"
            style={{ background: 'transparent', border: 'none', color: T.text, borderRadius: 8, width: 28, height: 28, fontSize: 13, cursor: 'pointer' }}>↶</button>
        </div>
        <div style={{ width: 1, height: 20, background: T.border, flexShrink: 0 }} />
        {/* Grupo Folha */}
        <div style={{ display: 'flex', gap: 3, background: T.ctrlBg, borderRadius: 10, padding: 2, flexShrink: 0 }}>
          {[['pautado', 'Pautado', '≡'], ['branco', 'Em branco', '□'], ['quadriculado', 'Quadriculado', '▦']].map(([p, lab, ic]) => (
            <button key={p} onClick={() => setPaper(p)} title={lab}
              style={{ background: paper === p ? T.ctrlHover : 'transparent', border: 'none', color: T.text, borderRadius: 8, width: 28, height: 28, fontSize: 15, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{ic}</button>
          ))}
        </div>
        <div style={{ width: 1, height: 20, background: T.border, flexShrink: 0 }} />
        {/* Botão Rejeição Toque */}
        <button onClick={() => setPenOnly((v) => !v)} title={penOnly ? "Ignorar toques (modo apenas caneta)" : "Aceitar caneta e toque"}
          style={{ background: penOnly ? T.accent : T.ctrlBg, border: `1px solid ${T.borderStrong}`, color: penOnly ? '#0E1326' : T.text, borderRadius: 10, width: 30, height: 30, cursor: 'pointer', fontSize: 13, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          {penOnly ? '✍️' : '👆'}
        </button>
      </div>

      {quota && (
        <div style={{ position: 'fixed', bottom: 70, left: '50%', transform: 'translateX(-50%)', zIndex: 120, background: '#7f1d1d', color: '#fff', padding: '8px 16px', borderRadius: 10, fontSize: 13, fontWeight: 700 }}>
          Memória cheia — use 💾 Backup e apague dias antigos no calendário.
        </div>
      )}

      <MedalToast medal={toast} T={T} />
      {showCal && <ProgressModal meta={meta} viewDate={viewDate} T={T}
        onPick={(d) => { setViewDate(d); setShowCal(false); }}
        onClose={() => setShowCal(false)}
        onDeleteDay={deleteDay}
        onExport={exportBackup}
        onImport={handleImport}
        onClearHistory={clearAllHistory} />}
    </div>
  );
}

const ctrlBtnS = (T) => ({ background: T.ctrlBg, border: `1px solid ${T.borderStrong}`, color: T.text, borderRadius: 10, width: 38, height: 38, cursor: 'pointer', fontSize: 20, fontWeight: 700, flex: '0 0 auto' });
const dockBtnS = (T) => ({ background: T.ctrlBg, border: `1px solid ${T.borderStrong}`, color: T.text, borderRadius: 10, height: 34, minWidth: 34, cursor: 'pointer', fontSize: 13, fontWeight: 800, fontFamily: "'Nunito', sans-serif" });

ReactDOM.createRoot(document.getElementById('root')).render(<DiaryApp />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
